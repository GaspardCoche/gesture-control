<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 280px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f14;
      color: #e2e8f0;
      padding: 16px;
    }
    h1 { font-size: 14px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    h1::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #6366f1; }
    .active h1::before { background: #10b981; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .btn {
      width: 100%; padding: 10px; border: none; border-radius: 8px;
      font-size: 13px; font-weight: 500; cursor: pointer; margin-bottom: 8px; transition: all 0.15s;
    }
    .btn-primary { background: #6366f1; color: white; }
    .btn-primary:hover { background: #4f46e5; }
    .btn-primary.on { background: #ef4444; }
    .btn-primary.on:hover { background: #dc2626; }
    .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 12px 0; }
    .modes.row3 { grid-template-columns: 1fr; }
    .mode-btn {
      padding: 8px 4px; border: 1px solid #27272a; border-radius: 6px;
      background: #1e1e2e; color: #94a3b8; font-size: 11px; text-align: center;
      cursor: pointer; transition: all 0.15s;
    }
    .mode-btn:hover { border-color: #6366f1; color: #e2e8f0; }
    .mode-btn.active { border-color: #6366f1; background: #6366f120; color: #6366f1; }
    .shortcuts {
      margin-top: 12px; padding: 10px; background: #1e1e2e; border-radius: 6px;
      font-size: 10px; color: #64748b; line-height: 1.8;
    }
    .shortcuts kbd {
      background: #27272a; padding: 1px 5px; border-radius: 3px; font-family: monospace; color: #94a3b8;
    }
    .footer { margin-top: 12px; font-size: 10px; color: #475569; text-align: center; }
  </style>
</head>
<body>
  <div id="wrapper">
    <h1>Gesture DevTools</h1>
    <button class="btn btn-primary" id="toggleBtn">Enable (F9)</button>
    <div class="modes">
      <button class="mode-btn active" data-mode="inspect">1 Inspect</button>
      <button class="mode-btn" data-mode="draw">2 Draw</button>
      <button class="mode-btn" data-mode="spotlight">3 Spotlight</button>
      <button class="mode-btn" data-mode="console">4 Console</button>
    </div>
    <div class="modes row3">
      <button class="mode-btn" data-mode="measure">5 Measure</button>
    </div>
    <button class="btn" style="background:#1e1e2e;color:#94a3b8;border:1px solid #27272a;" id="clearBtn">Clear (C)</button>
    <div class="shortcuts">
      <kbd>F9</kbd> Toggle on/off<br>
      <kbd>1-5</kbd> Switch modes<br>
      <kbd>C</kbd> Clear <kbd>Z</kbd> Undo <kbd>D</kbd> Debug borders<br>
      Peace sign = cycle modes
    </div>
    <div class="footer">Works on any website</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
